apis:
- aid: qualia:qualia-api
  name: Qualia API
  description: 'The Qualia API is a read-write GraphQL API over the Qualia title, escrow
    and closing platform. It lets partner organizations place title orders into Qualia
    Core or Connect (or route them to third-party systems), send and receive messages
    and documents on an order, and pull order, accounting and contact data for custom
    reporting, notifications and executive dashboards. Access is scoped by capability
    gates enabled per organization, and calls are authenticated with HTTP Basic credentials
    identifying the calling organization.'
