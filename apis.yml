aid: qualia
name: Qualia
description: 'Qualia (Qualia Labs, Inc.) is a digital real estate closing platform
  whose cloud-based title, escrow and settlement software brings title agents, lenders,
  real estate agents and consumers onto one secure system of record. Its product family
  spans Core (title and escrow production), Connect (the secure closing portal for
  lenders, agents and consumers), Shield (wire-fraud detection, identity verification
  and insured wire transfers), Marketplace (vendor and title-search ordering), Assure
  (underwriter management), Atlas (enterprise title and escrow), Clear (an agentic
  AI system for title production) and Resware (customizable title production). The
  Qualia API, launched in August 2022, is a read-write GraphQL interface at api.qualia.com/graphql
  that lets proptech companies, lenders and enterprise title operations place and track
  title orders, exchange messages and documents, and pull order, accounting and contact
  data for custom reporting and executive dashboards. Access is organized by capability
  gates granted per organization and authenticated with HTTP Basic credentials.'
